services:
  - type: web
    name: testpilot-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: "npm install && npm run build:css && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false