<!DOCTYPE html>
<html lang="en" class="h-full bg-panel-black text-fog selection:bg-instrument-amber selection:text-panel-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "TestPilot AI" }}</title>
    <!-- Space Grotesk (display), IBM Plex Sans (body), IBM Plex Mono (data/readouts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind Output CSS -->
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="h-full font-body antialiased bg-panel-black overflow-x-hidden flex flex-col justify-between min-h-screen">

    <!-- Console header -->
    <header class="sticky top-0 z-50 w-full backdrop-blur-md bg-panel-black/80 border-b border-panel-wire">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <span class="status-dot"></span>
                <span class="font-display font-semibold text-lg tracking-tight text-fog">
                    TestPilot<span class="text-instrument-amber">/</span>AI
                </span>
            </a>
            <nav class="hidden md:flex items-center gap-8 console-label text-instrument-gray">
                <a href="/" class="hover:text-fog transition-colors">Workspace</a>
                <a href="/features" class="hover:text-fog transition-colors">Pipeline</a>
                <a href="/docs" class="hover:text-fog transition-colors">API Docs</a>
                <a href="/settings" class="hover:text-fog transition-colors">Diagnostics</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="https://github.com" target="_blank" class="p-2 text-instrument-gray hover:text-fog transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 md:p-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 border-t border-panel-wire bg-panel-black/60 backdrop-blur-sm text-center console-label text-instrument-gray">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <p class="normal-case tracking-normal">&copy; 2026 TestPilot AI &mdash; instrumented test review.</p>
            <div class="flex gap-6">
                <a href="#" class="hover:text-fog transition-colors">Privacy</a>
                <a href="#" class="hover:text-fog transition-colors">Terms</a>
            </div>
        </div>
    </footer>
</body>
</html>
